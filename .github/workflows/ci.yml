name: CI
on:
  push:
    branches: [trunk]
  pull_request:
    branches: [ trunk ]

env:
    BUNDLE_PATH: /tmp/.bundle
    GEM_HOME: /tmp/.bundle
    GEM_PATH: /tmp/.bundle
    TERM: xterm256

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          components: clippy
          override: true
      - name: Generate system fingerprint for cache key
        id: system-fingerprint
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "SYS_FINGERPRINT=$(dpkg -l | md5sum | cut -d ' ' -f1)" >> $GITHUB_ENV
          else
            echo "SYS_FINGERPRINT=$(sw_vers | md5 | cut -d ' ' -f1)_$(brew list --versions | md5 | cut -d ' ' -f1)" >> $GITHUB_ENV
          fi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-2-${{ hashFiles('**/Cargo.lock') }}-${{ env.SYS_FINGERPRINT }}
      - run: cargo clippy --all --all-features -- -D warnings

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - run: |
          sudo apt-get install -y shellcheck
          ./script/lints/lint_fixtures.sh
          ./script/lints/lint_scripts.sh

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-22.04
          - os: macos-latest
          - os: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true
    - if: runner.os == 'macOS'
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.85.0
        target: aarch64-apple-darwin
        override: true
    - if: runner.os != 'macOS'
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.85.0
        override: true
        target: aarch64-unknown-linux-gnu
    - name: Generate system fingerprint for cache key
      id: system-fingerprint
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          echo "SYS_FINGERPRINT=$(dpkg -l | md5sum | cut -d ' ' -f1)" >> $GITHUB_ENV
        else
          echo "SYS_FINGERPRINT=$(sw_vers | md5 | cut -d ' ' -f1)_$(brew list --versions | md5 | cut -d ' ' -f1)" >> $GITHUB_ENV
        fi
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-2-${{ hashFiles('**/Cargo.lock') }}-${{ env.SYS_FINGERPRINT }}
    - if: runner.os == 'macOS'
      run: |
        brew install automake bison
        brew link bison --force
        echo "/usr/local/opt/bison/bin:$PATH" >> $GITHUB_PATH
    - run: cargo test --release
    - uses: actions/upload-artifact@v4
      with:
        name: rubyfmt-artifact-${{ matrix.os }}
        path: target/release/rubyfmt-main

