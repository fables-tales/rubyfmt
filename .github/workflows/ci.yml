name: CI
on:
  push:
    branches: [trunk]
  pull_request:
    branches: [ trunk ]

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          override: true
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.1
          components: clippy
          override: true
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-2-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy --all --all-features -- -D warnings

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get install -y shellcheck
          ./script/lints/lint_fixtures.sh
          ./script/lints/lint_scripts.sh

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-22.04
          - os: macos-latest
          - os: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - if: runner.os == 'macOS'
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.91.1
        target: aarch64-apple-darwin
        override: true
    - if: runner.os != 'macOS'
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.91.1
        override: true
        target: aarch64-unknown-linux-gnu
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-2-${{ hashFiles('**/Cargo.lock') }}
    - run: cargo test --release
    - uses: actions/upload-artifact@v6
      with:
        name: rubyfmt-artifact-${{ matrix.os }}
        path: target/release/rubyfmt-main

