name: Release
on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest
          - os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - if: runner.os == 'macOS'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.93.0
          target: aarch64-apple-darwin
          override: true
      - if: runner.os != 'macOS'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.93.0
          override: true
          target: aarch64-unknown-linux-gnu
      - run: ./script/make_release
      - uses: actions/upload-artifact@v6
        with:
          name: rubyfmt-release-artifact-${{ matrix.os }}
          path: rubyfmt-*.tar.gz
  release:
    runs-on: macos-latest
    needs:
      - build
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: rubyfmt-release-artifact-ubuntu-22.04
      - uses: actions/download-artifact@v5
        with:
          name: rubyfmt-release-artifact-macos-latest
      - uses: actions/download-artifact@v5
        with:
          name: rubyfmt-release-artifact-ubuntu-22.04-arm
      - name: Ship It 🚢
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rubyfmt-*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
