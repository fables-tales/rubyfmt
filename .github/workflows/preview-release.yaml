name: Preview Release
on:
  push:
    # Run only on trunk pushes that aren't a new tag release
    branches: [trunk]
    tags-ignore: "*"

jobs:
  bump-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-ecosystem/action-get-latest-tag@v1
        id: get-latest-tag
      - uses: actions-ecosystem/action-bump-semver@v1
        id: bump-semver
        with:
          current_version: ${{ steps.get-latest-tag.outputs.tag }}
          level: prepatch
      - uses: actions-ecosystem/action-push-tag@v1
        with:
          tag: ${{ steps.bump-semver.outputs.new_version }}
  build:
    runs-on: ${{ matrix.os }}
    needs: [bump-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest
          - os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - if: runner.os == 'macOS'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          target: aarch64-apple-darwin
          override: true
      - if: runner.os != 'macOS'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          override: true
          target: aarch64-unknown-linux-gnu
      - run: ./script/make_release
      - uses: actions/upload-artifact@v7
        with:
          name: rubyfmt-release-artifact-${{ matrix.os }}
          path: rubyfmt-*.tar.gz
  release:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v6
      - uses: actions-ecosystem/action-get-latest-tag@v1
        id: get-latest-tag
      - uses: actions/download-artifact@v8
        with:
          name: rubyfmt-release-artifact-ubuntu-22.04-arm
      - uses: actions/download-artifact@v8
        with:
          name: rubyfmt-release-artifact-ubuntu-22.04
      - uses: actions/download-artifact@v8
        with:
          name: rubyfmt-release-artifact-macos-latest
      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: rubyfmt-*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: true
          tag_name: ${{ steps.get-latest-tag.outputs.tag }}
