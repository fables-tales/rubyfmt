name: CI
on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

env:
    BUNDLE_PATH: /tmp/.bundle
    GEM_HOME: /tmp/.bundle
    GEM_PATH: /tmp/.bundle
    TERM: xterm256

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          components: clippy
          override: true
      - run: cargo clippy --all --all-features -- -D warnings

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - run: |
          sudo apt-get install -y shellcheck
          ./script/lints/lint_fixtures.sh
          ./script/lints/lint_scripts.sh

  prism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          override: true
          target: aarch64-unknown-linux-gnu
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-native-cargo-2-${{ hashFiles('**/Cargo.lock') }}
      - if: runner.os == 'macOS'
        run: |
          brew install automake bison
          brew link bison --force
          echo "/usr/local/opt/bison/bin:$PATH" >> $GITHUB_PATH
      - run: ./script/test.sh
        env:
          TARGET: native

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: native
          - os: ubuntu-20.04
            target: native
          - os: macos-latest
            target: native
          - os: ubuntu-20.04
            target: aarch64-unknown-linux-gnu
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true
    - if: runner.os == 'macOS'
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.85.0
        target: aarch64-apple-darwin
        override: true
    - if: runner.os != 'macOS'
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.85.0
        override: true
        target: aarch64-unknown-linux-gnu
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-2-${{ hashFiles('**/Cargo.lock') }}
    - if: runner.os == 'macOS'
      run: |
        brew install automake bison
        brew link bison --force
        echo "/usr/local/opt/bison/bin:$PATH" >> $GITHUB_PATH
    - if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64-unknown-linux-gnu=--sysroot=/usr/aarch64-linux-gnu" >> $GITHUB_ENV
    - run: ./script/test.sh
      env:
        TARGET: ${{ matrix.target }}
    - uses: actions/upload-artifact@v4
      with:
        name: rubyfmt-artifact-${{ matrix.os }}-${{ matrix.target }}
        path: target/${{ matrix.target == 'native' && 'release' || format('{0}/release', matrix.target) }}/rubyfmt-main

